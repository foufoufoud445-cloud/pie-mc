<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pie MC — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="shared.js"></script>
</head>
<body class="bg-[#090b10] min-h-screen text-white">

  <!-- Header -->
  <header class="border-b border-[#1c2333] bg-[#0a0d14]/80 backdrop-blur-xl sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 via-[#2cf5d6] to-emerald-400 p-0.5">
          <div class="w-full h-full bg-[#090b10] rounded-[10px] flex items-center justify-center">
            <span class="text-lg font-black bg-gradient-to-r from-[#2cf5d6] to-emerald-400 bg-clip-text text-transparent">π</span>
          </div>
        </div>
        <div>
          <h1 class="text-sm font-black text-white tracking-wider">SETTINGS</h1>
          <p class="text-[10px] text-slate-500 font-mono">Account & Profile</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <a href="dashboard.html" class="text-xs text-slate-400 hover:text-[#2cf5d6] font-mono">Dashboard</a>
        <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 font-mono">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-6 space-y-6">

    <div id="msg" class="hidden p-3 rounded-xl text-xs font-mono"></div>

    <!-- Profile Card -->
    <div class="pie-card p-6 space-y-4">
      <h2 class="text-lg font-bold text-white">Profile</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Username</label>
          <p id="profileUsername" class="text-white font-mono font-bold"></p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Email</label>
          <p id="profileEmail" class="text-white font-mono"></p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Role</label>
          <p id="profileRole" class="font-mono"></p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Last Login</label>
          <p id="profileLastLogin" class="text-slate-300 font-mono text-sm"></p>
        </div>
      </div>
    </div>

    <!-- Change Username (admin only) -->
    <div id="usernameSection" class="pie-card p-6 space-y-4 hidden">
      <h2 class="text-lg font-bold text-white">Change Username</h2>
      <div>
        <label class="block text-xs text-slate-300 mb-1">New Username</label>
        <input id="newUsername" type="text" class="pie-input w-full font-mono" placeholder="new username">
      </div>
      <button onclick="changeUsername()" class="btn-primary text-xs">Update Username</button>
    </div>

    <!-- Change Password -->
    <div class="pie-card p-6 space-y-4">
      <h2 class="text-lg font-bold text-white">Change Password</h2>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Current Password</label>
        <input id="currentPassword" type="password" class="pie-input w-full font-mono" placeholder="••••••••">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">New Password</label>
        <input id="newPassword" type="password" class="pie-input w-full font-mono" placeholder="••••••••">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">Confirm New Password</label>
        <input id="confirmPassword" type="password" class="pie-input w-full font-mono" placeholder="••••••••">
      </div>
      <button onclick="changePassword()" class="btn-primary text-xs">Update Password</button>
    </div>

  </main>

  <script>
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; }

    document.getElementById('profileUsername').textContent = user ? user.username : '';
    document.getElementById('profileEmail').textContent = user ? user.email : '';
    document.getElementById('profileRole').innerHTML = user ?
      `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${user.role === 'admin' ? 'bg-amber-500/20 text-amber-400' : 'bg-cyan-500/20 text-cyan-400'}">${user.role}</span>` : '';
    document.getElementById('profileLastLogin').textContent = user && user.last_login ? new Date(user.last_login).toLocaleString() : 'Now';

    if (user && user.role === 'admin') {
      document.getElementById('usernameSection').classList.remove('hidden');
    }

    function showMsg(text, isError) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `p-3 rounded-xl text-xs font-mono ${isError ? 'bg-red-500/10 border border-red-500/30 text-red-400' : 'bg-green-500/10 border border-green-500/30 text-green-400'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    async function changePassword() {
      const current = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!current || !newPass) return showMsg('All fields required', true);
      if (newPass !== confirm) return showMsg('Passwords do not match', true);
      if (newPass.length < 4) return showMsg('Password must be at least 4 characters', true);

      try {
        const res = await fetch('/api/user/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ currentPassword: current, newPassword: newPass })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('Password updated!', false);
          document.getElementById('currentPassword').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('confirmPassword').value = '';
        } else {
          showMsg(data.error || 'Failed', true);
        }
      } catch (e) { showMsg('Error: ' + e.message, true); }
    }

    async function changeUsername() {
      const newUsername = document.getElementById('newUsername').value.trim();
      if (!newUsername) return showMsg('Username required', true);

      try {
        const res = await fetch(`/api/admin/users/${user.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ username: newUsername })
        });
        const data = await res.json();
        if (data.success) {
          user.username = newUsername;
          localStorage.setItem('PIE_MC_USER', JSON.stringify(user));
          document.getElementById('profileUsername').textContent = newUsername;
          showMsg('Username updated!', false);
          document.getElementById('newUsername').value = '';
        } else {
          showMsg(data.error || 'Failed', true);
        }
      } catch (e) { showMsg('Error: ' + e.message, true); }
    }

    function logout() {
      localStorage.removeItem('PIE_MC_USER');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
