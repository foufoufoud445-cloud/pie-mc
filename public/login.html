<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pie MC — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-[#090b10] relative overflow-hidden">

  <!-- Subtle Ambient Glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#2cf5d6]/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="pie-card max-w-md w-full p-8 space-y-6 relative z-10 border border-[#1c2333] shadow-2xl">
    <!-- Brand Header -->
    <div class="text-center space-y-3">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-600 via-[#2cf5d6] to-emerald-400 p-0.5 shadow-xl shadow-cyan-500/25 mx-auto flex items-center justify-center">
        <div class="w-full h-full bg-[#090b10] rounded-[14px] flex items-center justify-center">
          <span class="text-3xl font-black bg-gradient-to-r from-[#2cf5d6] to-emerald-400 bg-clip-text text-transparent">π</span>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-black text-white tracking-wider">PIE MC</h1>
        <p class="text-xs text-slate-400 font-mono mt-0.5">Minecraft Management Suite</p>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginSection" class="space-y-4">
      <div id="errorMsg" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-mono"></div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" class="pie-input w-full font-mono" autocomplete="email">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" class="pie-input w-full font-mono" autocomplete="current-password">
      </div>

      <button onclick="handleLogin()" class="w-full py-3.5 px-4 rounded-xl bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold text-sm shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-3 transition-all transform active:scale-95">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span>Sign In</span>
      </button>

      <div class="text-center">
        <button onclick="showRegister()" class="text-xs text-slate-400 hover:text-[#2cf5d6] transition-colors">
          Don't have an account? <span class="font-semibold">Create one</span>
        </button>
      </div>
    </div>

    <!-- Register Form (hidden by default) -->
    <div id="registerSection" class="hidden space-y-4">
      <div id="regErrorMsg" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-mono"></div>
      <div id="regSuccessMsg" class="hidden p-3 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 text-xs font-mono"></div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <input id="regUsername" type="text" placeholder="yourname" class="pie-input w-full font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email</label>
        <input id="regEmail" type="email" placeholder="you@example.com" class="pie-input w-full font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input id="regPassword" type="password" placeholder="••••••••" class="pie-input w-full font-mono">
      </div>

      <button onclick="handleRegister()" class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 transition-all transform active:scale-95">
        Create Account
      </button>

      <div class="text-center">
        <button onclick="showLogin()" class="text-xs text-slate-400 hover:text-[#2cf5d6] transition-colors">
          Already have an account? <span class="font-semibold">Sign in</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-center text-[11px] font-mono text-slate-500 pt-1">
      <span>Encrypted Storage</span>
    </div>
  </div>

  <script>
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('registerSection').classList.add('hidden');
    }
    function showRegister() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
    }

    async function handleLogin() {
      hideError('errorMsg');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError('errorMsg', 'Email and password are required');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.success) {
          showError('errorMsg', data.error || 'Login failed');
          return;
        }

        // Store user session
        localStorage.setItem('PIE_MC_USER', JSON.stringify(data.user));
        window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      } catch (err) {
        showError('errorMsg', 'Connection error: ' + err.message);
      }
    }

    async function handleRegister() {
      hideError('regErrorMsg');
      hideError('regSuccessMsg');
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!username || !email || !password) {
        showError('regErrorMsg', 'All fields are required');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (!data.success) {
          showError('regErrorMsg', data.error || 'Registration failed');
          return;
        }

        document.getElementById('regSuccessMsg').textContent = 'Account created! Signing in...';
        document.getElementById('regSuccessMsg').classList.remove('hidden');

        // Auto-login after register
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const loginData = await loginRes.json();
        if (loginData.success) {
          localStorage.setItem('PIE_MC_USER', JSON.stringify(loginData.user));
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        showError('regErrorMsg', 'Connection error: ' + err.message);
      }
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (!document.getElementById('loginSection').classList.contains('hidden')) {
          handleLogin();
        } else {
          handleRegister();
        }
      }
    });
  </script>
</body>
</html>
